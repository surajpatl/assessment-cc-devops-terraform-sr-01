version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 15
    commands:
      - echo "Node version:"
      - node -v
      - echo "Installing dependencies"
      - npm install

  build:
    commands:
      - echo "Running lint"
      - npm run lint
      - echo "Fixing formatting"
      - npx prettier --write ./src/
      - echo "Running tests"
      - npm run test
      - echo "Building project"
      - npm run build

artifacts:
  files:
    - '**/*'