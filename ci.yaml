version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Node version:
      - node -v
      - echo Installing dependencies...
      - npm ci

  build:
    commands:
      - npm run lint
      - npm run prettier
      - npm run test
      - npm run build

artifacts:
  files:
    - '**/*'